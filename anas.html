<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberRadar ALPR Pro - Traffic Scanner System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Futuristic Tactical Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #030712;
      color: #00ff66;
      overflow: hidden;
    }
    .font-hud {
      font-family: 'Share Tech Mono', monospace;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    
    /* Radar Scan Sweep Effect */
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .radar-sweep {
      animation: sweep 4s linear infinite;
    }

    /* Target Reticle Pulsing */
    @keyframes pulse-lock {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 0.4; }
    }
    .pulse-target {
      animation: pulse-lock 1.2s infinite ease-in-out;
    }

    /* Glowing Text Effects */
    .glow-green {
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.7), 0 0 20px rgba(0, 255, 102, 0.4);
    }
    .glow-red {
      text-shadow: 0 0 10px rgba(255, 30, 60, 0.8), 0 0 20px rgba(255, 30, 60, 0.5);
    }
    .glow-box-green {
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.2);
    }
    .glow-box-red {
      box-shadow: 0 0 20px rgba(255, 30, 60, 0.6), inset 0 0 20px rgba(255, 30, 60, 0.3);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #00ff66;
      border-radius: 2px;
    }

    /* Shutter Flash Effect */
    .flash-active {
      animation: flashAnim 0.3s forwards;
    }
    @keyframes flashAnim {
      0% { background-color: rgba(255, 255, 255, 0.9); }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none bg-gray-950 text-green-400">

  <!-- Top Navigation & Radar Status Header -->
  <header class="absolute top-0 left-0 right-0 z-30 p-3 bg-gradient-to-b from-black/90 via-black/60 to-transparent backdrop-blur-md flex justify-between items-center border-b border-green-500/20">
    <div class="flex items-center space-x-3 space-x-reverse">
      <div class="relative flex items-center justify-center w-9 h-9 rounded-lg border border-green-500/40 bg-green-950/40 glow-box-green">
        <i class="fa-solid font-bold fa-radar text-green-400 text-lg animate-spin" style="animation-duration: 6s;"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold font-orbitron tracking-widest text-green-400 glow-green">CYBER-RADAR v4.2</h1>
        <div class="flex items-center space-x-2 space-x-reverse text-[10px] font-hud text-gray-400">
          <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
          <span id="systemStatusText" class="text-green-300">LIVE ALPR ACTIVE</span>
          <span class="text-gray-600">|</span>
          <span id="fpsCounter" class="text-xs text-green-400">60 FPS</span>
        </div>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-2 space-x-reverse">
      <!-- Sound Toggle -->
      <button id="soundToggleBtn" onclick="toggleAudio()" class="w-9 h-9 rounded-lg bg-gray-900/80 border border-green-500/30 text-green-400 flex items-center justify-center hover:bg-green-900/30 transition active:scale-95">
        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
      </button>

      <!-- Camera Switcher -->
      <button id="switchCamBtn" onclick="switchCamera()" class="w-9 h-9 rounded-lg bg-gray-900/80 border border-green-500/30 text-green-400 flex items-center justify-center hover:bg-green-900/30 transition active:scale-95">
        <i class="fa-solid fa-camera-rotate"></i>
      </button>

      <!-- Logs / Gallery Button -->
      <button onclick="toggleGalleryModal()" class="relative px-3 py-1.5 rounded-lg bg-green-500/20 border border-green-500/50 text-green-300 text-xs font-bold font-hud flex items-center space-x-1 space-x-reverse hover:bg-green-500/30 transition active:scale-95">
        <i class="fa-solid fa-folder-closed text-xs"></i>
        <span>السجل</span>
        <span id="logsCountBadge" class="ml-1 px-1.5 py-0.2 text-[10px] bg-red-600 text-white font-bold rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="relative w-full h-full flex-grow overflow-hidden bg-black flex items-center justify-center">
    <!-- Camera Video Source -->
    <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0"></video>

    <!-- Radar HUD Canvas for Vector Graphics -->
    <canvas id="hudCanvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>

    <!-- Flash Screen Effect Overlay -->
    <div id="flashOverlay" class="absolute inset-0 z-20 pointer-events-none"></div>

    <!-- PIP Driver Face Zoom Window -->
    <div id="pipWindow" class="absolute top-16 right-3 z-20 w-32 h-32 rounded-xl border-2 border-green-500/60 bg-black/80 backdrop-blur-md shadow-2xl overflow-hidden flex flex-col transition-all duration-300 transform scale-95 opacity-90 border-dashed">
      <div class="bg-green-950/80 px-2 py-0.5 text-[9px] font-hud text-green-300 flex justify-between items-center border-b border-green-500/30">
        <span>DRIVER ZOOM</span>
        <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
      </div>
      <div class="relative flex-grow bg-gray-900 flex items-center justify-center overflow-hidden">
        <canvas id="driverZoomCanvas" class="w-full h-full object-cover"></canvas>
        <div class="absolute inset-0 border border-red-500/40 pointer-events-none flex items-center justify-center">
          <div class="w-4 h-4 border-t border-l border-red-500"></div>
          <div class="w-4 h-4 border-b border-r border-red-500 absolute bottom-0 right-0"></div>
        </div>
      </div>
      <div class="bg-black/90 px-1 py-0.5 text-[8px] font-hud text-center text-green-400 truncate" id="driverDetectLabel">
        FACIAL LOCK: 98%
      </div>
    </div>

    <!-- Speed & Plate HUD Overlay Card (Floating) -->
    <div id="detectedInfoCard" class="absolute bottom-28 left-4 right-4 md:left-auto md:right-4 md:w-80 z-20 bg-gray-950/85 border border-green-500/50 rounded-2xl p-3.5 backdrop-blur-lg shadow-2xl transition-all duration-300 transform translate-y-0 glow-box-green">
      <div class="flex justify-between items-start border-b border-green-500/20 pb-2 mb-2">
        <div class="flex items-center space-x-2 space-x-reverse">
          <span class="flex h-3 w-3 relative">
            <span id="targetPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span id="targetDot" class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
          </span>
          <span id="carModelText" class="text-xs font-bold text-gray-200">مركبة: Mercedes-Benz C-Class</span>
        </div>
        <span id="speedDisplay" class="text-xl font-bold font-orbitron text-green-400 glow-green">74 km/h</span>
      </div>

      <!-- Moroccan / Standard Plate Display -->
      <div class="flex items-center justify-between bg-black/60 rounded-xl p-2 border border-gray-800">
        <div class="flex flex-col">
          <span class="text-[9px] text-gray-400 font-hud">لوحة الترقيم (PLATE)</span>
          <span id="plateNumberDisplay" class="text-lg font-extrabold font-hud tracking-widest text-white glow-green">
            58492 | أ | 6
          </span>
        </div>
        <div class="text-right">
          <span class="text-[9px] text-gray-400 block font-hud">الحالة</span>
          <span id="violationStatus" class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-green-900/60 text-green-300 border border-green-500/30">
            سليمة (OK)
          </span>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Tactical Radar Controls Toolbar -->
  <footer class="relative z-30 bg-gray-950/95 border-t border-green-500/30 px-4 py-3 backdrop-blur-xl flex flex-col space-y-3">
    <!-- Quick HUD Parameters Bar -->
    <div class="flex items-center justify-between text-xs font-hud text-gray-300 px-1">
      <div class="flex items-center space-x-2 space-x-reverse">
        <span class="text-gray-400">السرعة القصوى:</span>
        <select id="speedLimitSelect" onchange="updateSpeedLimit()" class="bg-gray-900 text-green-400 border border-green-500/40 rounded px-2 py-0.5 focus:outline-none font-bold">
          <option value="60">60 km/h</option>
          <option value="80" selected>80 km/h</option>
          <option value="100">100 km/h</option>
          <option value="120">120 km/h</option>
        </select>
      </div>

      <!-- Mode Selector (Morocco Plate / Global) -->
      <div class="flex items-center space-x-2 space-x-reverse">
        <span class="text-gray-400">النمط:</span>
        <button id="plateModeBtn" onclick="togglePlateFormat()" class="px-2 py-0.5 rounded bg-gray-900 border border-green-500/40 text-green-300 text-[11px]">
          لوحات المغرب 🇲🇦
        </button>
      </div>

      <!-- Camera / Upload Toggle -->
      <label class="cursor-pointer px-2 py-0.5 rounded bg-gray-900 border border-green-500/40 text-green-400 hover:bg-green-900/30 text-[11px] flex items-center space-x-1 space-x-reverse">
        <i class="fa-solid fa-file-arrow-up"></i>
        <span>رفع صورة</span>
        <input type="file" id="imageUploader" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
      </label>
    </div>

    <!-- Main Shutter & Trigger Row -->
    <div class="flex items-center justify-between space-x-3 space-x-reverse">
      <!-- Auto Scan Mode Button -->
      <button id="autoScanBtn" onclick="toggleAutoScan()" class="flex-1 py-3 rounded-xl bg-gray-900 border border-green-500/40 text-green-400 font-bold text-xs flex items-center justify-center space-x-2 space-x-reverse transition active:scale-95">
        <i id="autoScanIcon" class="fa-solid fa-robot text-sm"></i>
        <span id="autoScanText">المسح التلقائي: مشغل</span>
      </button>

      <!-- Central Big Radar Shutter Button -->
      <button onclick="triggerManualScan()" class="relative group w-16 h-16 rounded-full bg-gradient-to-tr from-green-600 to-emerald-400 p-1 flex items-center justify-center shadow-lg shadow-green-500/30 active:scale-90 transition transform">
        <div class="w-full h-full rounded-full bg-gray-950 flex items-center justify-center border-2 border-green-400 group-hover:bg-green-950">
          <i class="fa-solid fa-camera text-xl text-green-400"></i>
        </div>
      </button>

      <!-- Simulated Car Lock Target Trigger -->
      <button onclick="forceTargetLock()" class="flex-1 py-3 rounded-xl bg-gray-900 border border-green-500/40 text-green-400 font-bold text-xs flex items-center justify-center space-x-2 space-x-reverse transition active:scale-95">
        <i class="fa-solid fa-crosshairs text-sm text-red-400"></i>
        <span>التقاط هدف جديد</span>
      </button>
    </div>
  </footer>

  <!-- Violations & Snapshot Logs Drawer / Modal -->
  <div id="galleryModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex flex-col transition-all duration-300 opacity-0 pointer-events-none">
    <!-- Modal Header -->
    <div class="p-4 bg-gray-900/90 border-b border-green-500/30 flex justify-between items-center">
      <div class="flex items-center space-x-2 space-x-reverse">
        <i class="fa-solid fa-shield-halved text-green-400 text-lg"></i>
        <h2 class="text-base font-bold font-orbitron text-green-400">سجل الالتقاطات والمخالفات</h2>
      </div>
      <div class="flex items-center space-x-2 space-x-reverse">
        <button onclick="clearAllLogs()" class="px-2.5 py-1 rounded-lg bg-red-950/80 border border-red-500/40 text-red-400 text-xs font-bold hover:bg-red-900/50">
          مسح السجل
        </button>
        <button onclick="toggleGalleryModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 flex items-center justify-center hover:bg-gray-700">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Logs List Container -->
    <div id="logsContainer" class="flex-grow overflow-y-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Dynamic Log Cards inserted here -->
    </div>
  </div>

  <script>
    /* ========================================================================
       STATE & GLOBAL VARIABLES
       ======================================================================== */
    let currentStream = null;
    let facingMode = "environment"; // iPhone Back Camera
    let isAudioMuted = false;
    let isAutoScanActive = true;
    let speedLimit = 80;
    let isMoroccanPlate = true;
    let captureLogs = [];
    
    // Canvas & Video Elements
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const driverCanvas = document.getElementById('driverZoomCanvas');
    const driverCtx = driverCanvas.getContext('2d');

    // UI Displays
    const speedDisplay = document.getElementById('speedDisplay');
    const plateNumberDisplay = document.getElementById('plateNumberDisplay');
    const carModelText = document.getElementById('carModelText');
    const violationStatus = document.getElementById('violationStatus');
    const targetPing = document.getElementById('targetPing');
    const targetDot = document.getElementById('targetDot');
    const detectedInfoCard = document.getElementById('detectedInfoCard');

    // Simulated Target Vehicle Data Generator
    const carMakes = [
      "Mercedes-Benz C-Class", "BMW 3 Series", "Audi A4", "Dacia Logan", 
      "Volkswagen Golf 8", "Range Rover Evoque", "Peugeot 208", "Toyota Hilux", "Porsche Macan"
    ];

    const moroccoLetters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];

    let currentTarget = {
      x: 0.2, y: 0.3, w: 0.6, h: 0.4,
      speed: 74,
      model: "Mercedes-Benz C-Class",
      plate: "58492 | أ | 6",
      isViolation: false,
      driverConfidence: 96
    };

    /* ========================================================================
       AUDIO SYNTHESIZER (WEB AUDIO API)
       ======================================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(freq = 800, duration = 0.1, type = 'sine') {
      if (isAudioMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.error(e); }
    }

    function playAlertSound() {
      if (isAudioMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) { console.error(e); }
    }

    function toggleAudio() {
      isAudioMuted = !isAudioMuted;
      const soundIcon = document.getElementById('soundIcon');
      soundIcon.className = isAudioMuted ? "fa-solid fa-volume-xmark text-red-400" : "fa-solid fa-volume-high text-green-400";
      if (!isAudioMuted) playBeep(1000, 0.1);
    }

    /* ========================================================================
       CAMERA & INITIALIZATION
       ======================================================================== */
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        document.getElementById('systemStatusText').innerText = "LIVE RADAR ACTIVE";
      } catch (err) {
        console.warn("Front/Back Camera fallback applied:", err);
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = currentStream;
          await video.play();
        } catch (e) {
          document.getElementById('systemStatusText').innerText = "CAMERA BLOCKED / TEST MODE";
          simulateFallbackVideo();
        }
      }
      resizeCanvas();
    }

    function switchCamera() {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
      playBeep(900, 0.1);
    }

    function resizeCanvas() {
      canvas.width = video.clientWidth || window.innerWidth;
      canvas.height = video.clientHeight || window.innerHeight;
      driverCanvas.width = 150;
      driverCanvas.height = 150;
    }

    window.addEventListener('resize', resizeCanvas);

    /* Fallback canvas simulation if user denies camera */
    function simulateFallbackVideo() {
      // Creates animated canvas background simulating street motion
      const dummyCanvas = document.createElement('canvas');
      dummyCanvas.width = 640;
      dummyCanvas.height = 360;
      const dctx = dummyCanvas.getContext('2d');
      setInterval(() => {
        dctx.fillStyle = "#111827";
        dctx.fillRect(0, 0, 640, 360);
        dctx.strokeStyle = "#00ff66";
        dctx.lineWidth = 2;
        dctx.strokeRect(100, 80, 440, 200);
      }, 100);
    }

    /* ========================================================================
       RADAR HUD RENDER ENGINE
       ======================================================================== */
    let scanLineY = 0;

    function renderHUD() {
      if (!canvas.width || !canvas.height) {
        requestAnimationFrame(renderHUD);
        return;
      }

      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // 1. Tactical Radar Grid Lines
      ctx.strokeStyle = "rgba(0, 255, 102, 0.15)";
      ctx.lineWidth = 1;

      // Center Crosshair
      ctx.beginPath();
      ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
      ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
      ctx.stroke();

      // Corner Tech Brackets
      const pad = 20;
      const len = 30;
      ctx.strokeStyle = "rgba(0, 255, 102, 0.6)";
      ctx.lineWidth = 2;

      // Top Left
      ctx.beginPath(); ctx.moveTo(pad, pad + len); ctx.lineTo(pad, pad); ctx.lineTo(pad + len, pad); ctx.stroke();
      // Top Right
      ctx.beginPath(); ctx.moveTo(w - pad - len, pad); ctx.lineTo(w - pad, pad); ctx.lineTo(w - pad, pad + len); ctx.stroke();
      // Bottom Left
      ctx.beginPath(); ctx.moveTo(pad, h - pad - len); ctx.lineTo(pad, h - pad); ctx.lineTo(pad + len, h - pad); ctx.stroke();
      // Bottom Right
      ctx.beginPath(); ctx.moveTo(w - pad - len, h - pad); ctx.lineTo(w - pad, h - pad); ctx.lineTo(w - pad, h - pad - len); ctx.stroke();

      // 2. Animated Laser Scan Line
      scanLineY = (scanLineY + 3) % h;
      const grad = ctx.createLinearGradient(0, scanLineY - 15, 0, scanLineY + 15);
      grad.addColorStop(0, "rgba(0, 255, 102, 0)");
      grad.addColorStop(0.5, "rgba(0, 255, 102, 0.5)");
      grad.addColorStop(1, "rgba(0, 255, 102, 0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, scanLineY - 15, w, 30);

      // 3. Render Detected Target Bounding Box
      const bx = currentTarget.x * w;
      const by = currentTarget.y * h;
      const bw = currentTarget.w * w;
      const bh = currentTarget.h * h;

      const isViolation = currentTarget.speed > speedLimit;

      ctx.strokeStyle = isViolation ? "rgba(255, 30, 60, 0.9)" : "rgba(0, 255, 102, 0.8)";
      ctx.lineWidth = isViolation ? 3 : 2;
      ctx.setLineDash([10, 5]);
      ctx.strokeRect(bx, by, bw, bh);
      ctx.setLineDash([]);

      // Corner Highlights on target box
      ctx.fillStyle = isViolation ? "#ff1e3c" : "#00ff66";
      const bCorner = 12;
      ctx.fillRect(bx - 2, by - 2, bCorner, 3);
      ctx.fillRect(bx - 2, by - 2, 3, bCorner);
      ctx.fillRect(bx + bw - bCorner + 2, by - 2, bCorner, 3);
      ctx.fillRect(bx + bw - 1, by - 2, 3, bCorner);

      // Target Label
      ctx.font = "bold 12px 'Share Tech Mono', monospace";
      ctx.fillStyle = isViolation ? "#ff1e3c" : "#00ff66";
      ctx.fillText(`LOCK: ${currentTarget.model} | ${currentTarget.speed} KM/H`, bx, by - 8);

      // Update PIP Window with Cropped Driver Face Area
      updateDriverPIP(bx, by, bw, bh);

      requestAnimationFrame(renderHUD);
    }

    /* Update PIP canvas zoom area */
    function updateDriverPIP(bx, by, bw, bh) {
      if (!video.videoWidth) return;
      try {
        // Driver area assumed top left quarter inside target box
        const cropX = (bx / canvas.width) * video.videoWidth;
        const cropY = (by / canvas.height) * video.videoHeight;
        const cropW = (bw / canvas.width) * video.videoWidth * 0.45;
        const cropH = (bh / canvas.height) * video.videoHeight * 0.45;

        driverCtx.drawImage(
          video,
          cropX, cropY, cropW, cropH,
          0, 0, driverCanvas.width, driverCanvas.height
        );
      } catch (e) {}
    }

    /* ========================================================================
       TARGET LOCK & GENERATOR LOGIC
       ======================================================================== */
    function forceTargetLock() {
      const isViolation = Math.random() > 0.6;
      const speedOffset = isViolation ? Math.floor(Math.random() * 35) + 10 : -Math.floor(Math.random() * 20);
      const calculatedSpeed = speedLimit + speedOffset;

      // Generate Moroccan or International Plate
      let generatedPlate = "";
      if (isMoroccanPlate) {
        const num1 = Math.floor(10000 + Math.random() * 89999);
        const letter = moroccoLetters[Math.floor(Math.random() * moroccoLetters.length)];
        const region = Math.floor(1 + Math.random() * 70);
        generatedPlate = `${num1} | ${letter} | ${region}`;
      } else {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
        const randomStr = chars[Math.floor(Math.random() * chars.length)] + chars[Math.floor(Math.random() * chars.length)];
        const num = Math.floor(100 + Math.random() * 899);
        generatedPlate = `${randomStr}-${num}-XX`;
      }

      currentTarget = {
        x: 0.15 + Math.random() * 0.2,
        y: 0.25 + Math.random() * 0.2,
        w: 0.5 + Math.random() * 0.15,
        h: 0.35 + Math.random() * 0.15,
        speed: calculatedSpeed,
        model: carMakes[Math.floor(Math.random() * carMakes.length)],
        plate: generatedPlate,
        isViolation: calculatedSpeed > speedLimit,
        driverConfidence: Math.floor(88 + Math.random() * 11)
      };

      // Update UI elements
      speedDisplay.innerText = `${currentTarget.speed} km/h`;
      plateNumberDisplay.innerText = currentTarget.plate;
      carModelText.innerText = `مركبة: ${currentTarget.model}`;

      if (currentTarget.isViolation) {
        speedDisplay.className = "text-xl font-bold font-orbitron text-red-500 glow-red animate-pulse";
        violationStatus.className = "inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-red-950 text-red-400 border border-red-500/50";
        violationStatus.innerText = "مخالفة سرعة (VIOLATION)";
        targetPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75";
        targetDot.className = "relative inline-flex rounded-full h-3 w-3 bg-red-500";
        detectedInfoCard.className = "absolute bottom-28 left-4 right-4 md:left-auto md:right-4 md:w-80 z-20 bg-gray-950/90 border border-red-500/80 rounded-2xl p-3.5 backdrop-blur-lg shadow-2xl transition-all duration-300 transform translate-y-0 glow-box-red";
        
        playAlertSound();
      } else {
        speedDisplay.className = "text-xl font-bold font-orbitron text-green-400 glow-green";
        violationStatus.className = "inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-green-900/60 text-green-300 border border-green-500/30";
        violationStatus.innerText = "سليمة (OK)";
        targetPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75";
        targetDot.className = "relative inline-flex rounded-full h-3 w-3 bg-green-500";
        detectedInfoCard.className = "absolute bottom-28 left-4 right-4 md:left-auto md:right-4 md:w-80 z-20 bg-gray-950/85 border border-green-500/50 rounded-2xl p-3.5 backdrop-blur-lg shadow-2xl transition-all duration-300 transform translate-y-0 glow-box-green";
        
        playBeep(1200, 0.08);
      }

      document.getElementById('driverDetectLabel').innerText = `FACIAL LOCK: ${currentTarget.driverConfidence}%`;
    }

    /* Auto Scan Loop Generator */
    setInterval(() => {
      if (isAutoScanActive) {
        forceTargetLock();
        if (currentTarget.isViolation) {
          triggerSnapshot(true);
        }
      }
    }, 4500);

    /* ========================================================================
       SHUTTER CAPTURE & SNAPSHOT ENGINE
       ======================================================================== */
    function triggerManualScan() {
      forceTargetLock();
      triggerSnapshot(false);
    }

    function triggerSnapshot(isAuto = false) {
      // Trigger screen flash animation
      const flash = document.getElementById('flashOverlay');
      flash.classList.add('flash-active');
      setTimeout(() => flash.classList.remove('flash-active'), 300);

      playBeep(1500, 0.15, 'triangle');

      // Create snapshot image from current video + canvas overlay
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = video.videoWidth || 640;
      snapCanvas.height = video.videoHeight || 480;
      const sCtx = snapCanvas.getContext('2d');

      // Draw original video frame
      try {
        sCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
      } catch (e) {
        sCtx.fillStyle = "#111";
        sCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
      }

      // Burn Radar Metadata onto snapshot image
      sCtx.fillStyle = "rgba(0, 0, 0, 0.6)";
      sCtx.fillRect(0, snapCanvas.height - 50, snapCanvas.width, 50);
      sCtx.font = "bold 14px 'Share Tech Mono', monospace";
      sCtx.fillStyle = currentTarget.isViolation ? "#ff1e3c" : "#00ff66";
      const timeStr = new Date().toLocaleTimeString();
      sCtx.fillText(`RADAR LOG | TIME: ${timeStr} | SPEED: ${currentTarget.speed} KM/H | PLATE: ${currentTarget.plate}`, 15, snapCanvas.height - 20);

      const dataUrl = snapCanvas.toDataURL('image/jpeg', 0.85);

      const logRecord = {
        id: Date.now(),
        timestamp: new Date().toLocaleTimeString('ar-MA'),
        date: new Date().toLocaleDateString('ar-MA'),
        speed: currentTarget.speed,
        speedLimit: speedLimit,
        plate: currentTarget.plate,
        model: currentTarget.model,
        isViolation: currentTarget.isViolation,
        image: dataUrl,
        driverConfidence: currentTarget.driverConfidence
      };

      captureLogs.unshift(logRecord);
      updateLogsBadge();
      saveLogsToStorage();
    }

    /* ========================================================================
       MODAL & LOGS MANAGEMENT
       ======================================================================== */
    function toggleGalleryModal() {
      const modal = document.getElementById('galleryModal');
      const isHidden = modal.classList.contains('opacity-0');

      if (isHidden) {
        renderLogsList();
        modal.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        modal.classList.add('opacity-0', 'pointer-events-none');
      }
      playBeep(800, 0.05);
    }

    function renderLogsList() {
      const container = document.getElementById('logsContainer');
      container.innerHTML = "";

      if (captureLogs.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 font-hud">
            <i class="fa-solid fa-folder-open text-4xl mb-2 text-gray-600 block"></i>
            لا توجد أية التقاطات مسجلة حالياً
          </div>
        `;
        return;
      }

      captureLogs.forEach(log => {
        const card = document.createElement('div');
        card.className = `bg-gray-900/90 border ${log.isViolation ? 'border-red-500/50' : 'border-green-500/30'} rounded-xl overflow-hidden shadow-lg flex flex-col justify-between`;

        card.innerHTML = `
          <div class="relative h-44 bg-black overflow-hidden">
            <img src="${log.image}" class="w-full h-full object-cover">
            <div class="absolute top-2 right-2 px-2 py-0.5 rounded text-[10px] font-bold font-hud ${log.isViolation ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}">
              ${log.isViolation ? 'مخالفة سرعة' : 'سليمة'}
            </div>
            <div class="absolute bottom-2 left-2 bg-black/80 px-2 py-0.5 rounded text-xs font-orbitron font-bold text-green-400">
              ${log.speed} km/h
            </div>
          </div>

          <div class="p-3 flex flex-col space-y-1.5 font-hud">
            <div class="flex justify-between items-center text-xs">
              <span class="text-gray-400">السيارة:</span>
              <span class="text-gray-200 font-bold">${log.model}</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="text-gray-400">اللوحة:</span>
              <span class="text-green-300 font-bold text-sm tracking-wider">${log.plate}</span>
            </div>
            <div class="flex justify-between items-center text-[10px] text-gray-400 pt-1 border-t border-gray-800">
              <span>التوقيت: ${log.timestamp}</span>
              <button onclick="downloadRecordImage('${log.image}', 'Radar_${log.id}.jpg')" class="text-green-400 hover:underline">
                <i class="fa-solid fa-download ml-1"></i>حفظ
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function downloadRecordImage(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      a.click();
    }

    function updateLogsBadge() {
      document.getElementById('logsCountBadge').innerText = captureLogs.length;
    }

    function clearAllLogs() {
      captureLogs = [];
      saveLogsToStorage();
      updateLogsBadge();
      renderLogsList();
      playBeep(500, 0.2, 'sawtooth');
    }

    function saveLogsToStorage() {
      try {
        localStorage.setItem('cyberradar_logs', JSON.stringify(captureLogs.slice(0, 30)));
      } catch (e) {}
    }

    function loadLogsFromStorage() {
      try {
        const saved = localStorage.getItem('cyberradar_logs');
        if (saved) {
          captureLogs = JSON.parse(saved);
          updateLogsBadge();
        }
      } catch (e) {}
    }

    /* ========================================================================
       CONTROLS & TOGGLES
       ======================================================================== */
    function updateSpeedLimit() {
      speedLimit = parseInt(document.getElementById('speedLimitSelect').value);
      playBeep(1000, 0.05);
    }

    function togglePlateFormat() {
      isMoroccanPlate = !isMoroccanPlate;
      const btn = document.getElementById('plateModeBtn');
      btn.innerText = isMoroccanPlate ? "لوحات المغرب 🇲🇦" : "لوحات دولية 🌐";
      forceTargetLock();
    }

    function toggleAutoScan() {
      isAutoScanActive = !isAutoScanActive;
      const btn = document.getElementById('autoScanBtn');
      const text = document.getElementById('autoScanText');
      const icon = document.getElementById('autoScanIcon');

      if (isAutoScanActive) {
        btn.className = "flex-1 py-3 rounded-xl bg-gray-900 border border-green-500/40 text-green-400 font-bold text-xs flex items-center justify-center space-x-2 space-x-reverse transition active:scale-95";
        text.innerText = "المسح التلقائي: مشغل";
        icon.className = "fa-solid fa-robot text-sm text-green-400";
      } else {
        btn.className = "flex-1 py-3 rounded-xl bg-gray-900 border border-red-500/40 text-red-400 font-bold text-xs flex items-center justify-center space-x-2 space-x-reverse transition active:scale-95";
        text.innerText = "المسح التلقائي: متوقف";
        icon.className = "fa-solid fa-pause text-sm text-red-400";
      }
      playBeep(900, 0.08);
    }

    /* User Custom Image Upload Handler */
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          // Render uploaded photo onto video canvas context
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          forceTargetLock();
          triggerSnapshot(false);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* ========================================================================
       BOOTSTRAP APPLICATION
       ======================================================================== */
    window.onload = function() {
      startCamera();
      loadLogsFromStorage();
      renderHUD();
      forceTargetLock();
    };
  </script>
</body>
</html>
