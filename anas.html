<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Apple & iCloud Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* تعطيل تحديد النصوص والنسخ عبر الكود كامل */
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 0%, #1c1c1e, #000000 80%);
            color: #ffffff;
            padding: 25px 12px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 420px;
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 12px;
            color: #8e8e93;
            line-height: 1.4;
        }
        .section-title {
            width: 100%;
            max-width: 420px;
            font-size: 12px;
            color: #8e8e93;
            text-transform: uppercase;
            margin: 22px 0 10px 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 10px;
            width: 100%;
            max-width: 420px;
        }
        
        a.app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            /* السماح بقائمة المعاينة والضغط المطول الخاصة بـ iOS */
            -webkit-touch-callout: default !important;
            cursor: pointer;
        }
        .icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s ease, opacity 0.1s ease;
            border: 0.5px solid rgba(255, 255, 255, 0.15);
        }
        a.app-card:active .icon {
            transform: scale(0.86);
            opacity: 0.75;
        }
        .name {
            font-size: 11px;
            margin-top: 6px;
            text-align: center;
            color: #f2f2f7;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        /* Gradients لخدمات آبل */
        .ic-drive { background: linear-gradient(135deg, #007AFF, #00C6FF); }
        .ic-notes { background: linear-gradient(135deg, #FFCC00, #FF9500); }
        .ic-photos { background: linear-gradient(135deg, #FF2D55, #FF9500, #4CD964, #5AC8FA); }
        .ic-find { background: linear-gradient(135deg, #34C759, #109b30); }
        .ic-remind { background: linear-gradient(135deg, #FF3B30, #FF9500); }
        
        .media-music { background: linear-gradient(135deg, #FA233B, #FB5C74); }
        .media-podcasts { background: linear-gradient(135deg, #AF52DE, #5856D6); }
        .media-tv { background: linear-gradient(135deg, #2C2C2E, #000000); }
        .media-books { background: linear-gradient(135deg, #FF9500, #FF2D55); }
        
        .dev-testflight { background: linear-gradient(135deg, #007AFF, #5856D6); }
        .dev-appstore { background: linear-gradient(180deg, #1D7AF3, #084EB7); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Apple & iCloud Hub</h1>
        <p>اضغط مطولاً (Long Press) على أي تطبيق لاختيار "Open in App"</p>
    </div>

    <!-- iCloud Apps & Cloud Services -->
    <div class="section-title">iCloud Services</div>
    <div class="grid">
        <a href="https://www.icloud.com/iclouddrive" target="_blank" class="app-card">
            <div class="icon ic-drive">📁</div>
            <span class="name">Drive</span>
        </a>
        <a href="https://www.icloud.com/notes" target="_blank" class="app-card">
            <div class="icon ic-notes">📝</div>
            <span class="name">Notes</span>
        </a>
        <a href="https://www.icloud.com/photos" target="_blank" class="app-card">
            <div class="icon ic-photos">🖼️</div>
            <span class="name">Photos</span>
        </a>
        <a href="https://www.icloud.com/find" target="_blank" class="app-card">
            <div class="icon ic-find">📍</div>
            <span class="name">Find My</span>
        </a>
        <a href="https://www.icloud.com/reminders" target="_blank" class="app-card">
            <div class="icon ic-remind">المهام</div>
            <span class="name">Reminders</span>
        </a>
    </div>

    <!-- Media & Entertainment -->
    <div class="section-title">Media & Entertainment</div>
    <div class="grid">
        <a href="https://music.apple.com" target="_blank" class="app-card">
            <div class="icon media-music">🎵</div>
            <span class="name">Music</span>
        </a>
        <a href="https://podcasts.apple.com" target="_blank" class="app-card">
            <div class="icon media-podcasts">🎙️</div>
            <span class="name">Podcasts</span>
        </a>
        <a href="https://tv.apple.com" target="_blank" class="app-card">
            <div class="icon media-tv">📺</div>
            <span class="name">Apple TV</span>
        </a>
        <a href="https://books.apple.com" target="_blank" class="app-card">
            <div class="icon media-books">📚</div>
            <span class="name">Books</span>
        </a>
    </div>

    <!-- Developer & Utility Links -->
    <div class="section-title">Developer & Apps</div>
    <div class="grid">
        <a href="https://testflight.apple.com" target="_blank" class="app-card">
            <div class="icon dev-testflight">✈️</div>
            <span class="name">TestFlight</span>
        </a>
        <a href="https://apps.apple.com" target="_blank" class="app-card">
            <div class="icon dev-appstore">🅰️</div>
            <span class="name">App Store</span>
        </a>
    </div>

</body>
</html>
